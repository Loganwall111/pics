<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <meta
      name="description"
      content="AETHER CITY — a multitask WebGL2 3D reality simulator: procedural open world, raycast vehicles, Keplerian space flight and a quantum physics laboratory."
    />
    <title>AETHER CITY // WebGL2 Reality Simulator</title>
    <style>
      /* Critical pre-boot styles: the canvas host must be a full-viewport
         fixed surface before React mounts (see engine/rendering contract). */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04070d;
        color: #d7e6f2;
        font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
      }
      #root {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: radial-gradient(120% 120% at 50% 10%, #0b1626 0%, #04070d 70%);
        z-index: 10;
      }
      #boot h1 {
        font-size: 15px;
        letter-spacing: 0.55em;
        font-weight: 600;
        color: #6fe3ff;
        margin: 0;
        text-transform: uppercase;
      }
      #boot .bar {
        width: 180px;
        height: 2px;
        background: rgba(111, 227, 255, 0.15);
        overflow: hidden;
        border-radius: 2px;
      }
      #boot .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #6fe3ff, #ff5fd2);
        animation: bootscan 1.1s ease-in-out infinite alternate;
      }
      @keyframes bootscan {
        from {
          transform: translateX(-60%);
        }
        to {
          transform: translateX(220%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>Aether City</h1>
      <div class="bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
